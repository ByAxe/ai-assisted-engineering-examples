spring:
  application:
    name: audit-log-service
  datasource:
    url: ${AUDIT_LOG_JDBC_URL:jdbc:postgresql://localhost:5432/audit_log}
    username: ${AUDIT_LOG_DB_USER:audit}
    password: ${AUDIT_LOG_DB_PASSWORD:audit}
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

server:
  port: 8080

